# Draft units table. All numbers are PLACEHOLDERS to be tuned.
version: 4

common_stats: [hp, ap_max, ap_regen, attack, defense, move_speed, vision_range, movement_class, armor_type, morale]
# attack:   accuracy. Raises hit chance under orders/AI, tightens spread in first-person aim.
# defense:  evasion. Lowers the chance of being hit. Neither stat changes damage (decision 58).
# armor_type: one of data/combat.yaml armor_types. Damage = weapon x weapon-vs-armor table.
# vision_range: metres, before weather, terrain and height modifiers (data/terrain.yaml, decision 59).
# movement_class: foot | wheeled | tracked
# capabilities (optional list): abilities a unit has on top of its category and movement class.
#   flying: the unit moves with the `flying` profile of data/terrain.yaml and is hit as a
#           flying target (weapon airborne_factor, data/combat.yaml). Flying is not a unit
#           category, not a movement class and not an armor type.
#   boat:   the unit moves only on water with the `boat` profile of data/terrain.yaml.
#           It has no ground movement_class. (Amphibious units: Q-MAP-03.)
# weapons (decision 52): one slot. `default` comes with the unit (included in its price);
#   `allowed` lists the weapon types it may equip at storage or pick up on the field.
#   Allowed lists are placeholders.
# morale: 0..100, starts at data/combat.yaml morale.base. See specs/70-combat-and-ap.md.

units:
  commander:
    category: commander
    movement_class: foot
    armor_type: infantry
    base: { hp: 200, ap_max: 100, ap_regen: 2.0, attack: 15, defense: 10, move_speed: 5, vision_range: 150 }
    weapons: { default: rifle, allowed: [rifle, machine_gun] }
    role: { aura_radius: 30 }  # section size cap and storage: progression.commander_levels
    permadeath: false          # always resurrects at HQ, no delay (decision 80)
  soldier:
    category: soldier
    movement_class: foot
    armor_type: infantry
    base: { hp: 100, ap_max: 60, ap_regen: 1.5, attack: 12, defense: 5, move_speed: 5, vision_range: 150 }
    weapons: { default: rifle, allowed: [rifle, machine_gun, anti_tank, anti_air] }
  engineer:
    category: engineer
    movement_class: foot
    armor_type: infantry
    base: { hp: 90, ap_max: 80, ap_regen: 1.5, attack: 6, defense: 4, move_speed: 4, vision_range: 120 }
    weapons: { default: rifle, allowed: [rifle, explosive] }
    role: { build: [bridge, reinforced_bridge, ladder, wall, road_segment, trap], repair: true }
  scout:
    category: scout
    movement_class: foot
    armor_type: infantry
    base: { hp: 70, ap_max: 70, ap_regen: 2.0, attack: 5, defense: 8, move_speed: 7, vision_range: 300 }
    weapons: { default: rifle, allowed: [rifle] }
    role: { reports_to_radio: true }
  medic:
    category: soldier          # decision 60: a medic is a soldier with a heal role
    movement_class: foot
    armor_type: infantry
    base: { hp: 80, ap_max: 70, ap_regen: 1.5, attack: 4, defense: 3, move_speed: 5, vision_range: 120 }
    weapons: { default: rifle, allowed: [rifle] }
    role: { heal: true, earns_money_when_healing: true }
  artillery:
    category: artillery
    movement_class: tracked
    armor_type: light_vehicle
    base: { hp: 150, ap_max: 80, ap_regen: 1.0, attack: 10, defense: 2, move_speed: 2, vision_range: 100 }
    weapons: { default: artillery, allowed: [artillery] }   # range, splash, deformation: weapon data
  radio:
    category: radio
    movement_class: tracked
    armor_type: structure
    base: { hp: 250, ap_max: 40, ap_regen: 0.5, attack: 0, defense: 0, move_speed: 0.3, vision_range: 80 }
    weapons: { default: null, allowed: [] }   # unarmed: cannot attack (decision 64)
    role: { relay_range: 150, shares_with: all_sections_of_team, transportable: false }   # starting range, evolves via tree
    purchasable_by: commander   # normal unit: destructible, can be captured, stored (decision 76)

  # Roster v1 additions (decision 61)
  jeep:
    category: vehicle
    movement_class: wheeled
    armor_type: light_vehicle
    base: { hp: 180, ap_max: 120, ap_regen: 2.0, attack: 8, defense: 6, move_speed: 15, vision_range: 150 }
    weapons: { default: machine_gun, allowed: [machine_gun] }
  tank:
    category: vehicle
    movement_class: tracked
    armor_type: heavy_vehicle
    base: { hp: 600, ap_max: 100, ap_regen: 1.5, attack: 10, defense: 1, move_speed: 6, vision_range: 120 }
    weapons: { default: anti_tank, allowed: [anti_tank, machine_gun] }
  truck:
    category: transport
    movement_class: wheeled
    armor_type: light_vehicle
    base: { hp: 250, ap_max: 120, ap_regen: 2.0, attack: 0, defense: 3, move_speed: 12, vision_range: 100 }
    weapons: { default: null, allowed: [] }   # unarmed: cannot attack (decision 64)
    role: { capacity: 6, carries: [foot] }
  helicopter:
    category: vehicle
    movement_class: wheeled     # ground class used while landed (decision 68)
    capabilities: [flying]
    flying: { land_time_s: 8, take_off_time_s: 8 }   # placeholder; max altitude is set by the map
    armor_type: light_vehicle
    base: { hp: 200, ap_max: 120, ap_regen: 2.0, attack: 10, defense: 10, move_speed: 20, vision_range: 300 }
    weapons: { default: machine_gun, allowed: [machine_gun, anti_tank] }
  boat:
    category: transport
    movement_class: null        # water only
    capabilities: [boat]
    armor_type: light_vehicle
    base: { hp: 200, ap_max: 100, ap_regen: 2.0, attack: 8, defense: 4, move_speed: 8, vision_range: 150 }
    weapons: { default: machine_gun, allowed: [machine_gun] }
    role: { capacity: 4, carries: [foot] }

# Progression (decisions 77-79)
progression:
  xp_sources:                     # placeholders
    hit: 2
    kill: 20
    role_action: 5                # per completed build, repair, heal, spotting report
    capture: 50
    near_commander_per_min: 1
  target_scaling:                 # hit/kill XP x min(cap, 1 + target_xp / max(attacker_xp, 1))
    cap: 3.0
  diminishing:                    # same target or same build spot, within the window
    window_s: 600
    factor_per_repeat: 0.5
  friendly_hits_give_xp: false
  section_xp_share: 0.2           # share of each XP point earned by a unit, moved to section XP
  # Section XP sets the commander level. It cannot be spent on stats.
  commander_levels:               # placeholders; storage capacity: Q-HQ-04
    - { level: 1, section_xp: 0,     section_size_cap: 4,  storage_capacity: 8 }
    - { level: 2, section_xp: 500,   section_size_cap: 6,  storage_capacity: 12 }
    - { level: 3, section_xp: 1500,  section_size_cap: 8,  storage_capacity: 16 }
    - { level: 4, section_xp: 4000,  section_size_cap: 11, storage_capacity: 22 }
    - { level: 5, section_xp: 10000, section_size_cap: 15, storage_capacity: 30 }

# Evolution trees (skill-point trees with prerequisites).
# Each unit spends its OWN XP on its own tree, commander included (decision 78).
# Nodes are permanent (no respec) and never exclude each other; XP cost is the only cap.
trees:
  soldier:
    nodes:
      tough_1:  { cost: 100, requires: [],                effects: { hp: +10 } }
      tough_2:  { cost: 250, requires: [tough_1],         effects: { hp: +20 } }
      sprint:   { cost: 200, requires: [],                effects: { move_speed: +10% } }
      sharp_1:  { cost: 150, requires: [],                effects: { attack: +5 } }
      breacher: { cost: 400, requires: [sharp_1, tough_1], ability: breach_wall }
  radio:
    nodes:
      antenna_1: { cost: 200, requires: [],          effects: { relay_range: +25 } }
      antenna_2: { cost: 400, requires: [antenna_1], effects: { relay_range: +50 } }
