# Draft terrain table. All numbers are PLACEHOLDERS to be tuned.
# ap_cost_per_m: AP spent per metre moved (before the slope factor).
# null means impassable for that movement class or profile.
version: 1
movement_classes: [foot, wheeled, tracked]
# The `flying` and `boat` entries below are movement PROFILES, used by units that have the
# flying or boat capability (data/units.yaml). They are not movement classes.

slope:
  # cost multiplier = 1 + slope_degrees * factor ; impassable above max_degrees
  foot:    { factor: 0.05, max_degrees: 45 }
  wheeled: { factor: 0.10, max_degrees: 25 }
  tracked: { factor: 0.07, max_degrees: 35 }
  flying:  { factor: 0.0,  max_degrees: 90 }
  boat:    { factor: 0.0,  max_degrees: 90 }   # water is flat

# Vision (decision 59)
# effective_vision = vision_range * weather.vision_factor * terrain[observer].vision_factor
#                    + height_bonus ; then hard line-of-sight blockers apply.
vision:
  height_bonus_m_per_m: 2.0     # extra vision metres per metre the observer stands above the target
  height_bonus_max_m: 150

# Weather is a per-battle state that changes over time (decision 59). Change rules: Q-MAP-08.
weather:
  clear: { vision_factor: 1.0 }
  rain:  { vision_factor: 0.7 }
  fog:   { vision_factor: 0.4 }
  snow:  { vision_factor: 0.6 }

terrain:
  grass:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: 1.0, wheeled: 1.0, tracked: 1.0, flying: 0.5, boat: null }
  forest_floor:           # ground under trees
    blocks_los: true      # trees block line of sight
    vision_factor: 0.5    # observer standing in a forest sees less far
    ap_cost_per_m: { foot: 1.5, wheeled: 3.0, tracked: 2.5, flying: 0.5, boat: null }
  sand:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: 1.5, wheeled: 2.0, tracked: 1.5, flying: 0.5, boat: null }
  mud:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: 2.0, wheeled: 4.0, tracked: 2.0, flying: 0.5, boat: null }
  rock:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: 1.5, wheeled: 2.0, tracked: 1.5, flying: 0.5, boat: null }
  road:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: 0.7, wheeled: 0.4, tracked: 0.5, flying: 0.5, boat: null }
  town_street:
    blocks_los: false
    vision_factor: 0.8
    ap_cost_per_m: { foot: 0.8, wheeled: 0.6, tracked: 0.7, flying: 0.5, boat: null }
  mountain:
    blocks_los: true
    vision_factor: 1.0
    ap_cost_per_m: { foot: 3.0, wheeled: null, tracked: null, flying: 0.5, boat: null }
  river:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: null, wheeled: null, tracked: null, flying: 0.5, boat: 0.8 }
    crossable_by_flags: [boat, amphibious]
  lake:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: null, wheeled: null, tracked: null, flying: 0.5, boat: 0.6 }
    crossable_by_flags: [boat, amphibious]
  floating_island_ground:
    blocks_los: false
    vision_factor: 1.0
    ap_cost_per_m: { foot: 1.0, wheeled: 1.0, tracked: 1.0, flying: 0.5, boat: null }
    access: [flying, bridge, ladder]

objects:
  tree:      { blocks_los: true,  destructible: true,  placeholder_hp: 100 }
  building:  { blocks_los: true,  destructible: true,  placeholder_hp: 500 }
  wall:      { blocks_los: true,  destructible: true,  built_by: engineer }
  bridge:    { blocks_los: false, destructible: true,  built_by: engineer, relic_crossable: false }
  reinforced_bridge: { blocks_los: false, destructible: true, built_by: engineer, relic_crossable: true }  # heavier: more cost and build time
  ladder:    { blocks_los: false, destructible: true,  built_by: engineer }
  road_segment: { blocks_los: false, destructible: true, built_by: engineer }
  trap:      { blocks_los: false, destructible: true,  built_by: engineer, hidden_from_enemies: true }
