# Draft terrain table. All numbers are PLACEHOLDERS to be tuned.
# ap_multiplier: factor on the unit's ap_per_m (data/units.yaml), per movement class and terrain,
#   before the slope factor. Grass is 1.0 for every class (decision 169).
# null means impassable for that movement class or profile.
version: 6
movement_classes: [foot, wheeled, tracked]
# The `flying` and `sail` entries below are movement PROFILES, used by units that have the
# flying or sail capability (data/units.yaml). They are not movement classes.
# A landed flying unit uses its ground movement_class (decision 68).
# Flying altitude limit: the map's highest terrain point + this many metres (decision 142).
flying_max_above_highest_terrain_m: 10

slope:
  # Slope is signed (decision 133): positive uphill, negative downhill.
  # cost multiplier = max(min_multiplier, 1 + slope_degrees * factor)
  # Impassable when the slope, up or down, is steeper than max_degrees. Pushing uses the same multiplier.
  foot:    { factor: 0.05, max_degrees: 45, min_multiplier: 0.5 }   # min_multiplier: placeholder
  wheeled: { factor: 0.10, max_degrees: 25, min_multiplier: 0.5 }
  tracked: { factor: 0.07, max_degrees: 35, min_multiplier: 0.5 }
  flying:  { factor: 0.0,  max_degrees: 90, min_multiplier: 1.0 }
  sail:    { factor: 0.0,  max_degrees: 90, min_multiplier: 1.0 }   # water is flat

# Vision (decision 59)
# effective_vision = vision_range * weather.vision_factor * terrain[observer].vision_factor
#                    + height_bonus ; then hard line-of-sight blockers apply.
vision:
  height_bonus_m_per_m: 2.0     # extra vision metres per metre the observer stands above the target
  height_bonus_max_m: 150
  # Forest concealment (decision 87): each metre of forest crossed by the sight line
  # removes this many metres of the observer's effective vision. A flying observer's
  # line crosses less forest, so it sees forest targets more easily.
  forest_vision_cost_per_m: 4.0
  destroyed_objects_block: false

# Weather is a per-battle state that changes randomly, per map (decisions 59, 90; data/battle.yaml).
weather:
  clear: { vision_factor: 1.0 }
  rain:  { vision_factor: 0.7 }
  fog:   { vision_factor: 0.4 }
  snow:  { vision_factor: 0.6 }

terrain:
  grass:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: 1.0, wheeled: 1.0, tracked: 1.0, flying: 0.5, sail: null }
  forest_floor:           # ground under trees
    blocks_los: false     # partial: forest concealment, see vision.forest_vision_cost_per_m
    vision_factor: 0.5    # observer standing in a forest sees less far
    ap_multiplier: { foot: 1.5, wheeled: 3.0, tracked: 2.5, flying: 0.5, sail: null }
  sand:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: 1.5, wheeled: 2.0, tracked: 1.5, flying: 0.5, sail: null }
  mud:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: 2.0, wheeled: 4.0, tracked: 2.0, flying: 0.5, sail: null }
  rock:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: 1.5, wheeled: 2.0, tracked: 1.5, flying: 0.5, sail: null }
  road:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: 0.7, wheeled: 0.4, tracked: 0.5, flying: 0.5, sail: null }
  town_street:
    blocks_los: false
    vision_factor: 0.8
    ap_multiplier: { foot: 0.8, wheeled: 0.6, tracked: 0.7, flying: 0.5, sail: null }
  mountain:
    blocks_los: true
    vision_factor: 1.0
    ap_multiplier: { foot: 3.0, wheeled: null, tracked: null, flying: 0.5, sail: null }
  river:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: null, wheeled: null, tracked: null, flying: 0.5, sail: 0.8 }
    crossable_by: [sail]   # boats and amphibious units (decision 86)
  lake:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: null, wheeled: null, tracked: null, flying: 0.5, sail: 0.6 }
    crossable_by: [sail]   # boats and amphibious units (decision 86)
  floating_island_ground:
    blocks_los: false
    vision_factor: 1.0
    ap_multiplier: { foot: 1.0, wheeled: 1.0, tracked: 1.0, flying: 0.5, sail: null }
    access: [flying, bridge, ladder]

# Craters (decision 85)
craters:
  max_depth_m: 20
  fillable_by_engineers: false

# Objects (decision 89: HP). Destroyed trees and structures never regrow (decision 85).
# Every object has an armor type for the damage table: structure by default (decision 137).
# Constructions (decision 113): AP paid up front + build time, no money. Values are placeholders
# except the reinforced bridge (decision 99).
objects:
  tree:      { armor_type: structure, blocks_los: false, conceals: forest, destructible: true, hp: 100 }
  building:  { armor_type: structure, blocks_los: true,  destructible: true, hp: 500 }
  wall:      { armor_type: structure, blocks_los: true,  destructible: true, hp: 200, built_by: engineer, ap: 10, build_time_s: 300 }
  bridge:    { armor_type: structure, blocks_los: false, destructible: true, hp: 200, built_by: engineer, relic_crossable: false, ap: 10, build_time_s: 300 }
  reinforced_bridge: { armor_type: structure, blocks_los: false, destructible: true, hp: 400, built_by: engineer, relic_crossable: true, ap: 20, build_time_s: 600 }  # decision 99
  ladder:    { armor_type: structure, blocks_los: false, destructible: true, hp: 100, built_by: engineer, ap: 5, build_time_s: 120 }
  road_segment: { armor_type: structure, blocks_los: false, destructible: true, hp: 100, built_by: engineer, ap: 5, build_time_s: 120 }
  trap:      { armor_type: structure, blocks_los: false, destructible: true, hp: 50, built_by: engineer, hidden_from_enemies: true, ap: 5, build_time_s: 60 }
